name: CD Prod

# main 브랜치에 머지(push)될 때만 실행.
# dev와 달리 별도 CI workflow_run에 의존하지 않고, 이 워크플로 안에서 빌드+테스트(CI 내용)까지 수행한 뒤 배포한다.
on:
  push:
    branches: [ main ]

env:
  IMAGE: ghcr.io/bbangbat/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout submodules
        run: |
          git config --global url."https://x-access-token:${{ secrets.CONFIG_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      # ===== CI: 빌드 + ktlint + 테스트 (실패 시 배포 중단) =====
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and check (ktlint + test)
        run: ./gradlew build

      # ===== CD: 이미지 빌드/푸시 후 prod EC2 배포 =====
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app/build/libs
          file: bbangbat-config/infra/Dockerfile-prod
          platforms: linux/arm64
          push: true
          # 어느 커밋이 떠 있는지 추적하고 롤백할 수 있도록 해시 태그를 함께 붙인다
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Get GitHub Actions IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Add IP to Security Group
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_PROD_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Copy infra & config to EC2
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PROD_SSH_KEY }}
          source: bbangbat-config/infra,bbangbat-config/config
          target: ~/bbangbat-prod
          strip_components: 1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_PROD_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PROD_SSH_KEY }}
          # 중간 명령이 실패해도 마지막 명령만 성공하면 스텝이 초록불이 되는 걸 막는다.
          # (pull 실패를 못 잡아 옛 이미지로 재기동되던 문제)
          script_stop: true
          script: |
            set -euo pipefail
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # dev/prod가 한 인스턴스를 공유해 디스크가 빠듯하다. 받기 전에 먼저 비운다.
            # (pull 뒤에 정리하면 정작 pull 할 공간이 없어 레이어 추출이 실패한다)
            # 실행 중인 컨테이너가 참조하는 이미지는 제거되지 않는다.
            docker image prune -af
            docker builder prune -af
            df -h /

            export IMAGE_TAG=${{ github.sha }}
            docker pull ${{ env.IMAGE }}:$IMAGE_TAG

            cd ~/bbangbat-prod/infra
            docker compose -f docker-compose-prod.yml down
            docker compose -f docker-compose-prod.yml up -d --force-recreate

      - name: Delete old container versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: api
          package-type: container
          min-versions-to-keep: 5

      - name: Remove IP from Security Group
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-northeast-2
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_PROD_SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
